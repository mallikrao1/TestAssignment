name: Tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: |
          python -c "from pathlib import Path; count = len(Path('src/hanoi_crossing/engine.py').read_text().splitlines()); print(count); assert count < 500"
      - run: python -m hanoi_crossing replay examples/example-win.json
